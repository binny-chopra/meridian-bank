<section aria-labelledby="user-activity-heading">
  <h2 id="user-activity-heading">User Activity</h2>

  @if (activity() === undefined) {
    <p role="status">Loading users…</p>
  } @else if (activity() === null) {
    <p role="alert">Could not load user activity. Please try again.</p>
  } @else {
    <table>
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Email</th>
          <th scope="col">Posts</th>
        </tr>
      </thead>
      <tbody>
        @for (user of activity(); track user.id) {
          <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.postCount }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
