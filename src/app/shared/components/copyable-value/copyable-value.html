<span class="value">{{ value() }}</span>
<button type="button" class="copy-button" [appCopyToClipboard]="value()">
  <svg class="icon icon-copy" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
    <rect x="3" y="3" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" />
    <rect x="7" y="7" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" />
  </svg>
  <svg class="icon icon-check" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
    <path
      d="M4 10l4 4 8-8"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>
